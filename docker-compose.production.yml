# ============================================
# Production Deployment - Docker Hub Images Only
# Pulls all images from Docker Hub (no local builds)
#
# NETWORKING: This stack uses host networking (network_mode: host).
# Required on enterprise/kiosk hosts where the Docker daemon cannot
# create per-container network namespaces (error: "bind mount
# /proc/<pid>/ns/net -> /var/run/docker/netns/...: permission denied").
# With host networking all services share the host's network stack and
# reach each other via 127.0.0.1:<port> instead of by container name.
#
# DATABASE: the bundled `db` container is OPTIONAL. Postgres 18 + the
# required extensions (pgvector, ...) is validated, so production can run
# against a native/managed Postgres instead. The `db` service is gated
# behind the `bundled-db` profile and the app/migrate services depend on it
# with `required: false`, so they start fine when it is absent.
#   - External Postgres (default): set DB_HOST (defaults to 127.0.0.1 — the
#     host's native Postgres under host networking) and DB creds in .env, and
#     do NOT pass --profile bundled-db.
#   - Bundled container: pass --profile bundled-db to also run the pgvector
#     container (legacy behavior).
#
# Usage:
#   # First time — run migrations (external DB):
#   docker compose -f docker-compose.production.yml --profile migrate up
#   # ...or with the bundled container:
#   docker compose -f docker-compose.production.yml --profile bundled-db --profile migrate up
#
#   # Start the stack (external DB):
#   docker compose -f docker-compose.production.yml up -d
#   # ...or with the bundled container:
#   docker compose -f docker-compose.production.yml --profile bundled-db up -d
#
#   # Tear down (preserves data):
#   docker compose -f docker-compose.production.yml down
#
#   # Tear down and reset all data:
#   docker compose -f docker-compose.production.yml down -v
# ============================================

name: softpower_production

services:
  # -----------------------
  # PostgreSQL + pgvector  (OPTIONAL — only with `--profile bundled-db`)
  # Listens on host:${DB_PORT:-5432}. Omit the profile to use a native/managed
  # Postgres 18 instead (set DB_HOST/creds in .env).
  # -----------------------
  db:
    image: mmorrisj/pgvector:0.8.2-pg17
    container_name: sp_prod_db
    restart: unless-stopped
    network_mode: host
    profiles:
      - bundled-db
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
      PGPORT: ${DB_PORT:-5432}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${DB_PORT:-5432} -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------
  # Redis Cache
  # Bound to 127.0.0.1 only — host networking exposes ports on the host
  # Replace image with your enterprise hardened Redis image if required
  # e.g., dhi/redis:7
  # -----------------------
  redis:
    image: redis:7-alpine
    container_name: sp_prod_redis
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------
  # SoftPower Analytics (FastAPI + Streamlit via supervisord)
  # Single consolidated container from Docker Hub
  # Binds host:${API_PORT:-8000} (FastAPI) and host:${STREAMLIT_PORT:-8501} (Streamlit)
  # -----------------------
  app:
    image: mmorrisj/softpower-analytics:${APP_VERSION:-2.0.3}
    container_name: sp_prod_app
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DOCKER_ENV: "true"
      # DB_HOST defaults to 127.0.0.1 (host networking reaches both the bundled
      # container and a native host Postgres). Set DB_HOST in .env to point at a
      # remote/managed Postgres 18.
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_HOST: ${DB_HOST:-127.0.0.1}
      POSTGRES_PORT: ${DB_PORT:-5432}
      # NOTE: If POSTGRES_PASSWORD contains special chars (@, /, #, %), they must
      # be URL-encoded here. The app also builds the URL from individual vars
      # (with auto-encoding) so you can omit DATABASE_URL entirely.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@${DB_HOST:-127.0.0.1}:${DB_PORT:-5432}/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      API_PORT: ${API_PORT:-8000}
      STREAMLIT_PORT: ${STREAMLIT_PORT:-8501}
      # Host-side proxy for LLM/S3 calls — runs on the same host, reachable at 127.0.0.1
      # LLM_PROXY_PORT defaults to 7001; set LLM_PROXY_PORT in .env to override
      API_URL: http://127.0.0.1:${LLM_PROXY_PORT:-7001}
      S3_PROXY_URL: http://127.0.0.1:${LLM_PROXY_PORT:-7001}
      USE_S3_API_CLIENT: "true"
      # Pass through credentials from .env (will be empty if not set)
      CLAUDE_KEY: ${CLAUDE_KEY:-}
      OPENAI_PROJ_API: ${OPENAI_PROJ_API:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Connection pooling
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      # HuggingFace offline mode (model baked into image)
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      HF_HOME: /app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/huggingface/hub
      TIKTOKEN_CACHE_DIR: /app/.cache/tiktoken
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ${JWT_SECRET:-softpower-jwt-secret-change-in-production-min32chars}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
    volumes:
      # Persist reports to host
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
        required: false   # bundled db is optional; external Postgres needs no wait
      redis:
        condition: service_healthy

  # -----------------------
  # Alembic Migrations (run once with --profile migrate)
  # -----------------------
  migrate:
    image: mmorrisj/softpower-analytics:${APP_VERSION:-2.0.3}
    container_name: sp_prod_migrate
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DOCKER_ENV: "true"
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      # NOTE: If POSTGRES_PASSWORD contains special chars (@, /, #, %), they must
      # be URL-encoded here. The app also builds the URL from individual vars
      # (with auto-encoding) so you can omit DATABASE_URL entirely.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@${DB_HOST:-127.0.0.1}:${DB_PORT:-5432}/${POSTGRES_DB:?Set POSTGRES_DB in .env}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
        required: false   # bundled db is optional; external Postgres needs no wait
    profiles:
      - migrate

# -----------------------
# Persistent Volumes
# Pin names explicitly so docker-compose and production-deploy.sh
# always reference the exact same Docker objects.
# Note: no `networks:` block — all services use host networking, which
# avoids the per-container netns bind mount that fails on kiosk hosts.
# -----------------------
volumes:
  prod_pgdata:
    name: softpower_production_prod_pgdata
