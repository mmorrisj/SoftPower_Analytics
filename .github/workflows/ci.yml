# ===========================================
# CI Pipeline - Runs on every push/PR
# ===========================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # -----------------------------------------
  # Job 1: Lint & Type Check
  # -----------------------------------------
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: pip install ruff black isort

      # Genuine-bug rules (syntax errors, undefined names) are surfaced
      # separately and should become blocking once the existing violations are
      # fixed. Tracked follow-up: clean the ~412 ruff findings + 4 undefined-name
      # bugs, then drop continue-on-error here. See MAINTAINABILITY_ASSESSMENT §6.
      - name: Run Ruff (fast Python linter)
        run: ruff check . --ignore E501
        continue-on-error: true  # Non-blocking until the existing backlog is cleared

      - name: Check formatting with Black
        run: black --check --diff . || true

  # -----------------------------------------
  # Job 2: Run Tests
  # -----------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      # Spin up PostgreSQL with pgvector for tests
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout pytest-xdist

      - name: Setup test directories
        run: |
          mkdir -p test-results
          mkdir -p htmlcov

      - name: Run unit tests
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_URL: postgresql+psycopg2://testuser:testpass@localhost:5432/testdb
          TESTING: 1
        # Blocking: a unit-test regression must fail the build.
        run: |
          pytest tests/ -m unit --no-header --junitxml=test-results/junit-unit.xml

      - name: Run integration tests
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_URL: postgresql+psycopg2://testuser:testpass@localhost:5432/testdb
          TESTING: 1
        run: |
          pytest tests/ -m "integration and not slow and not llm" --no-header --junitxml=test-results/junit-integration.xml || echo "Integration tests failed or skipped"
        continue-on-error: true

      - name: Run all tests with coverage
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_URL: postgresql+psycopg2://testuser:testpass@localhost:5432/testdb
          TESTING: 1
        # Blocking with a coverage floor to prevent backsliding. The floor is
        # intentionally low to match the current baseline (~9%); ratchet it up
        # as coverage improves. See docs/MAINTAINABILITY_ASSESSMENT.md §6.
        run: |
          pytest tests/ --cov=shared --cov=services --cov=server --cov-config=.coveragerc --cov-report=xml --cov-report=html:htmlcov --cov-report=term-missing --cov-fail-under=8 --junitxml=test-results/junit-all.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}  # Optional for public repos

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn

      - name: Comment coverage on PR
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 70
          MINIMUM_ORANGE: 50
        continue-on-error: true

  # -----------------------------------------
  # Job 3: Build Docker Images
  # -----------------------------------------
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]  # Only run if lint and test pass
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          push: false  # Just build, don't push yet
          tags: softpower-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/dashboard.Dockerfile
          push: false
          tags: softpower-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------
  # Job 4: Security Scan (optional but recommended)
  # -----------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
